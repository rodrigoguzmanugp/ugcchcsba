<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ejecutivo UGCC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:48px; text-align:center; max-width:500px; }
  .icon { font-size:48px; margin-bottom:16px; }
  h1 { color:#0f172a; font-size:1.5rem; font-weight:700; margin-bottom:8px; }
  p { color:#64748b; font-size:0.95rem; line-height:1.6; }
  .badge { display:inline-block; background:#fef3c7; color:#92400e; border:1px solid #fcd34d; border-radius:6px; padding:4px 12px; font-size:0.8rem; font-weight:600; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📊</div>
  <h1>Dashboard Ejecutivo</h1>
  <p>Este módulo mostrará el resumen ejecutivo visual de todos los datos del sistema de gestión de camas hospitalarias.</p>
  <div class="badge">🔧 En construcción</div>
</div>
</body>
</html>
